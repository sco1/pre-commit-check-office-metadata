name: lint-and-test

on:
  pull_request:
  push:
    branches:
      - main
    tags-ignore:
      - "**"  # Skip re-linting when tags are added

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run mypy
        run: uv run mypy .

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Get Non-Hyphenated Python Version
        id: get-pyver
        env:
          PY_VERSION: ${{ matrix.python-version }}
        run: |
          echo "PYVER=$(cut -d '-' -f 1 <<< "$PY_VERSION")" >> "$GITHUB_OUTPUT"

      - name: Set up (release) Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.1.0
        if: "!endsWith(matrix.python-version, '-dev')"
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up (deadsnakes) Python ${{ matrix.python-version }}
        uses: deadsnakes/action@v3.2.0
        if: endsWith(matrix.python-version, '-dev')
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.x"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install dependencies
        env:
          PYVER: ${{ steps.get-pyver.outputs.PYVER }}
        run: |
          uv venv --python "$PYVER"
          uv pip install tox-uv

      - name: Run tests w/tox
        env:
          PYVER: ${{ steps.get-pyver.outputs.PYVER }}
        run: |
          uv run tox -e "$PYVER"

      - name: Cache coverage for ${{ matrix.python-version }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cov_py${{ matrix.python-version }}
          path: .coverage
          if-no-files-found: error
          include-hidden-files: true

  combine-cov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: test

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Pull coverage workflow artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: cov_cache/

      - name: Install cov & combine
        run: |
          python -m pip install coverage
          coverage combine ./cov_cache/**/.coverage

      - name: Report coverage
        run: |
          coverage html

          # Report a markdown version to the action summary
          echo '**Combined Coverage**' >> $GITHUB_STEP_SUMMARY
          coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

      - name: Publish cov HTML
        uses: actions/upload-artifact@v7.0.2
        with:
          path: htmlcov/
          name: cov_report_html
